name: Bug report
description: Something on the site or the Android app is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to /tv/\n2. ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device
      placeholder: Firefox 130 on Linux, or Pixel 8 (Android 15)
